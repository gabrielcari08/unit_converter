<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="{% static 'conversions/css/styles.css' %}">
</head>
<body>
    <h1>Unit Converter</h1>
    <form method="GET" id="conversion-form">
        <div class="form-group">
            <label for="value">Valor:</label>
            <input type="number" step="any" id="value" name="value" required>
        </div>

        <div class="form-group">
            <label for="category">Categoría:</label>
            <select id="category" name="category">
                <option value="longitud">Longitud</option>
                <option value="peso">Peso</option>
                <option value="temperatura">Temperatura</option>
            </select>
        </div>

        <div class="form-group">
            <label for="from">Desde:</label>
            <select id="from" name="from"></select>
        </div>

        <div class="form-group">
            <label for="to">Hacia:</label>
            <select id="to" name="to"></select>
        </div>

        <button type="submit">Convertir</button>
    </form>

    <div id="result-container" class="result">
        <h2>Resultado:</h2>
        <p id="result-value">-</p>
        <p id="result-unit"></p>
    </div>

    <script src="{% static 'conversions/js/script.js' %}"></script>
</body>
</html>
